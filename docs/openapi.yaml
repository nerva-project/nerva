  /json_rpc:
    post:
      tags:
      - JSON-RPC
      summary: JSON-RPC 2.0 endpoint.
      description: 'Submits a JSON-RPC 2.0 request. The `method` field selects the command and `params`
        carries its parameters; the request schema of every method is a component named after it and `params`
        accepts any of them.


        Public methods (29) are safe to expose on a public node. Restricted methods (12) are only registered
        when the daemon runs without --restricted-rpc and without --rpc-restricted-bind-port. --rpc-login

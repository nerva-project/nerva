components:
  securitySchemes:
    rpcLogin:
      type: http
      scheme: digest
      description: HTTP digest authentication, enabled by --rpc-login user:pass.
  schemas:
    AddPeerRequest:
      type: object
      properties:
        host:
          type: string
    AddPeerResponse:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    BannedRequest:
      type: object
      properties:
        address:
          type: string
    BannedResponse:
      type: object
      properties:
        status:
          type: string
        banned:
          type: boolean
        seconds:
          type: integer
          format: int32
      required:
      - status
      - banned
      - seconds
    BlockHeaderResponse:
      type: object
      properties:
        major_version:
          type: integer
          format: int32
        minor_version:
          type: integer
          format: int32
        timestamp:
          type: integer
          format: int64
        prev_hash:
          type: string
          description: Hex-encoded binary data.
        nonce:
          type: integer
          format: int32
        orphan_status:
          type: boolean
        height:
          type: integer
          format: int64
          description: Block height.
        depth:
          type: integer
          format: int64
        hash:
          type: string
          description: Hex-encoded binary data.
        difficulty:
          type: integer
          format: int64
          description: Current difficulty. Serialized as a JSON number; on very long chains it can exceed
            the JavaScript safe integer range.
        cumulative_difficulty:
          type: integer
          format: int64
          description: Low 64 bits of the 128-bit cumulative difficulty. Serialized as a JSON number,
            which exceeds the JavaScript safe integer range on long chains; parse it losslessly (the high
            64 bits are in cumulative_difficulty_top64).
        cumulative_difficulty_top64:
          type: integer
          format: int64
          description: High 64 bits of the 128-bit cumulative difficulty (see cumulative_difficulty for
            the low bits).
        reward:
          type: integer
          format: int64
        block_size:
          type: integer
          format: int64
        block_weight:
          type: integer
          format: int64
        num_txes:
          type: integer
          format: int64
        long_term_weight:
          type: integer
          format: int64
        miner_tx_hash:
          type: string
          description: Hex-encoded binary data.
      required:
      - major_version
      - minor_version
      - timestamp
      - prev_hash
      - nonce
      - orphan_status
      - height
      - depth
      - hash
      - difficulty
      - cumulative_difficulty
      - cumulative_difficulty_top64
      - reward
      - block_size
      - num_txes
      - miner_tx_hash
    ConnectionInfo:
      type: object
      properties:
        incoming:
          type: boolean
        localhost:
          type: boolean
        local_ip:
          type: boolean
        address:
          type: string
        host:
          type: string
        ip:
          type: string
        port:
          type: string
        rpc_port:
          type: integer
          format: int32
        peer_id:
          type: string
        recv_count:
          type: integer
          format: int64
        recv_idle_time:
          type: integer
          format: int64
        send_count:
          type: integer
          format: int64
        send_idle_time:
          type: integer
          format: int64
        state:
          type: string
        live_time:
          type: integer
          format: int64
        avg_download:
          type: integer
          format: int64
        current_download:
          type: integer
          format: int64
        avg_upload:
          type: integer
          format: int64
        current_upload:
          type: integer
          format: int64
        support_flags:
          type: integer
          format: int32
        connection_id:
          type: string
        height:
          type: integer
          format: int64
          description: Block height.
        pruning_seed:
          type: integer
          format: int32
        address_type:
          type: integer
          format: int32
      required:
      - incoming
      - localhost
      - local_ip
      - address
      - host
      - ip
      - port
      - rpc_port
      - peer_id
      - recv_count
      - recv_idle_time
      - send_count
      - send_idle_time
      - state
      - live_time
      - avg_download
      - current_download
      - avg_upload
      - current_upload
      - support_flags
      - connection_id
      - height
      - pruning_seed
      - address_type
    DecodeOutputsDecodedOut:
      type: object
      properties:
        tx_hash:
          type: string
          description: Hex-encoded binary data.
        payment_id:
          type: string
        amount:
          type: integer
          format: int64
      required:
      - tx_hash
      - payment_id
      - amount

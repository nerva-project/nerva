openapi: 3.0.3
info:
  title: Nerva Daemon RPC API
  description: 'REST and JSON-RPC API of the Nerva (XNV) daemon.


    The daemon serves two kinds of endpoints: REST style paths such as /get_info, and JSON-RPC 2.0 methods
    called by POSTing to /json_rpc. Paths ending in .bin answer with a binary epee serialization instead
    of JSON.


    Restricted endpoints and methods are only registered when the daemon runs without --restricted-rpc
    and without --rpc-restricted-bind-port. --rpc-login adds HTTP digest authentication but does not re-enable
    restricted methods.


    Default RPC ports: mainnet 17566, testnet 18566, stagenet 19566. The security scheme below applies
    when the daemon is started with --rpc-login.


    This document is generated from the daemon source by scripts/openapi/generate_openapi.py and is checked
    for drift in CI.'
  version: 3.1.0
  contact:
    name: Nerva Project
    url: https://nerva.one
  license:
    name: BSD-3-Clause
    url: https://opensource.org/licenses/BSD-3-Clause
servers:
- url: http://127.0.0.1:17566
  description: Local mainnet daemon.
- url: http://127.0.0.1:18566
  description: Local testnet daemon.
- url: http://127.0.0.1:19566
  description: Local stagenet daemon.
security:
- rpcLogin: []
tags:
- name: Network
  description: Network wide information and statistics.
- name: Blocks
  description: Block queries, headers and submission.
- name: Transactions
  description: Transaction queries and submission.
- name: Mempool
  description: Transaction mempool contents and management.
- name: Mining
  description: Mining, block templates and emission.
- name: Peers
  description: Peer lists, connections and bans.
- name: Outputs
  description: Output keys, indexes and distributions.
- name: Logging
  description: Log level and category management.
- name: Daemon
  description: Daemon control and maintenance.
- name: Nerva-specific
  description: Commands specific to Nerva, absent from Monero.
- name: JSON-RPC
  description: The JSON-RPC 2.0 transport endpoint.
- name: Restricted
  description: Only registered on a non-restricted daemon. Restricted endpoints and methods are only registered
    when the daemon runs without --restricted-rpc and without --rpc-restricted-bind-port. --rpc-login
    adds HTTP digest authentication but does not re-enable restricted methods.

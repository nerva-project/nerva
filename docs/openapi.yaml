        `decode_outputs` (Nerva-specific)

        `get_block` (Blocks)

        `get_block_count` (Blocks)

        `get_block_header_by_hash` (Blocks)

        `get_block_header_by_height` (Blocks)

        `get_block_headers_range` (Blocks)

        `get_block_template` (Blocks)

        `get_fee_estimate` (Fees)

        `get_generated_coins` (Nerva-specific)

        `get_info` (Network)

        `get_last_block_header` (Blocks)

        `get_min_version` (Nerva-specific)

        `get_output_distribution` (Outputs)

        `get_output_histogram` (Outputs)

        `get_tx_pubkey` (Nerva-specific)

        `get_txpool_backlog` (Mempool)

        `get_version` (Version)

        `getblock` (Blocks)

        `getblockcount` (Blocks)

        `getblockheaderbyhash` (Blocks)

        `getblockheaderbyheight` (Blocks)

        `getblockheadersrange` (Blocks)

        `getblocktemplate` (Mining)

        `getlastblockheader` (Blocks)

        `hard_fork_info` (Hard Forks)

        `on_get_block_hash` (Blocks)

        `on_getblockhash` (Blocks)

        `submit_block` (Blocks)

        `submitblock` (Mining)


        Restricted (grouped by category):

        `add_peer` (Nerva-specific)

        `banned` (Peers)

        `flush_cache` (Daemon)

        `flush_txpool` (Mempool)

        `get_alternate_chains` (Blocks)

        `get_bans` (Peers)

        `get_coinbase_tx_sum` (Mining)

        `get_connections` (Peers)

        `prune_blockchain` (Blocks)

        `relay_tx` (Transactions)

        `set_bans` (Peers)

        `sync_info` (Daemon)'
      operationId: json_rpc
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonRpcRequest'
      responses:
        '200':
          description: JSON-RPC response envelope; carries either result or error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonRpcResponse'

name: ci/gh-actions/openapi

on:
    push:
        branches:
            - master
        paths:
            - 'src/rpc/**'
            - 'src/cryptonote_protocol/cryptonote_protocol_defs.h'
            - 'scripts/openapi/**'
            - 'docs/openapi.yaml'
            - '.github/workflows/openapi.yml'
    pull_request:
        paths:
            - 'src/rpc/**'
            - 'src/cryptonote_protocol/cryptonote_protocol_defs.h'
            - 'scripts/openapi/**'
            - 'docs/openapi.yaml'
            - '.github/workflows/openapi.yml'

jobs:
    openapi:
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Set up Python
                uses: actions/setup-python@v5
                with:
                    python-version: '3.11'

            -   name: Install generator dependencies
                run: pip install -r scripts/openapi/requirements.txt openapi-spec-validator

            -   name: Generate the specification
                run: python3 scripts/openapi/generate_openapi.py

            -   name: Fail on drift against the committed specification
                run: |
                    if ! git diff --exit-code docs/openapi.yaml; then
                      echo "docs/openapi.yaml is out of sync with the RPC sources." >&2
                      echo "Run python3 scripts/openapi/generate_openapi.py and commit the result." >&2
                      exit 1
                    fi

            -   name: Validate the specification
                run: openapi-spec-validator docs/openapi.yaml
